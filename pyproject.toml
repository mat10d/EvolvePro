[project]
name = "evolvepro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.87",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "numpy<2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.7.2",
    "scikit-learn-extra>=0.3.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "tomli>=2.4.1",
    "xgboost==1.7.6",
]

[project.scripts]
evolvepro = "evolvepro.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evolvepro*"]

[tool.uv]
default-groups = ["test"]

[dependency-groups]
test = [
    "joblib>=1.5.3",
    "pandas-stubs>=2.3.3.260113",
    "pytest>=9.0.3",
    "pytest-regressions>=2.10.0",
]
